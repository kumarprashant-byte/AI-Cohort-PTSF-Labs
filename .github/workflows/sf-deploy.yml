name: SF Deploy

# Salesforce DEPLOY for the SIMPLE pipeline (feature → main). The deploy half of
# the sf-validate + sf-deploy pair — see .github/workflows/README.md for the
# two-pipeline choice (#57). Triggers on a push to main (i.e. a human merged the
# PR); deploys to the integration org. Uses the same SFDX_URL secret as
# sf-validate (reconciled from the old SFDX_AUTH_URL_INTEGRATION, #57).

# NOTE: this `paths:` trigger is static YAML — GitHub can't read it from
# sfdx-project.json. It defaults to force-app/. If your repo declares a
# different packageDirectories path (src/, packaged/, …), ADD that path here so a
# merge that touches only that dir still deploys (issue #64). The deploy step
# itself resolves the real dirs.
on:
  push:
    branches: [main]
    paths:
      - "force-app/**"
      - "sfdx-project.json"
      - "config/**"
      - ".github/workflows/sf-deploy.yml"
  workflow_dispatch:

concurrency:
  group: sf-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Resolve the deployable package directories from sfdx-project.json so the
      # deploy below isn't hardcoded to force-app/ (issue #64).
      # FAIL CLOSED, correctly: when we can't scope to specific subdirs (missing/
      # unparseable file, no packageDirectories, or a ROOT "." package),
      # scope_all=true → pass no --source-dir so sf deploys the project's own
      # packageDirectories, rather than guessing force-app/ (fail-OPEN for a
      # custom-dir repo).
      - name: Resolve package directories
        id: resolve-dirs
        run: |
          node -e '
            const fs = require("fs");
            let dirs = null;
            try {
              const p = JSON.parse(fs.readFileSync("sfdx-project.json", "utf8"));
              dirs = (p.packageDirectories || [])
                .map(d => String((d && d.path) || "").replace(/^\.\//, "").replace(/\/+$/, ""))
                .filter(s => s !== "");
            } catch (e) { dirs = null; }
            const out = process.env.GITHUB_OUTPUT;
            const scopeAll = dirs === null || dirs.length === 0 || dirs.some(d => d === ".");
            if (scopeAll) {
              console.log("::warning::Could not scope to package directories — deploying the project default (fail-closed).");
              fs.appendFileSync(out, "scope_all=true\npkg_dirs=\n");
              console.log("Package directories: <project default>");
              process.exit(0);
            }
            fs.appendFileSync(out, `scope_all=false\npkg_dirs=${dirs.join(" ")}\n`);
            console.log("Resolved package directories: " + dirs.join(" "));
          '

      - name: Install sf CLI
        run: npm install -g @salesforce/cli@latest

      - name: Authenticate to integration org
        env:
          SFDX_URL: ${{ secrets.SFDX_URL }}
        run: |
          if [ -z "$SFDX_URL" ]; then
            echo "::error::SFDX_URL secret not set — cannot deploy."
            exit 1
          fi
          printf '%s' "$SFDX_URL" > /tmp/sfdx-auth.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx-auth.txt --alias integration --set-default
          rm /tmp/sfdx-auth.txt

      - name: Deploy to integration
        env:
          PKG_DIRS: ${{ steps.resolve-dirs.outputs.pkg_dirs }}
          SCOPE_ALL: ${{ steps.resolve-dirs.outputs.scope_all }}
        run: |
          # One --source-dir per resolved package dir (repeatable flag) — issue #64.
          # scope_all → none, so sf deploys the project's own packageDirectories.
          # PKG_DIRS via env (data), not `${{ }}` (shell source) — so a path can't inject.
          src_args=()
          if [ "$SCOPE_ALL" != "true" ]; then
            for d in $PKG_DIRS; do
              src_args+=(--source-dir "$d")
            done
          fi
          sf project deploy start --target-org integration "${src_args[@]}" --test-level RunLocalTests
