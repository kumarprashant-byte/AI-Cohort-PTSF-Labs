<template>
    <lightning-card title="Digital Assessment" icon-name="standard:document">
        <div class="slds-p-around_medium">
            <p class="slds-text-body_small slds-m-bottom_small">
                Treatment Type: <strong>{treatmentType}</strong> &middot; {statusLabel}
            </p>

            <template for:each={fieldsForRender} for:item="f">
                <div key={f.api_name} class="slds-m-bottom_small">
                    <template lwc:if={f.isText}>
                        <lightning-input type="text" label={f.label} required={f.required}
                            value={f.value} data-name={f.api_name} data-type="text"
                            onchange={handleInput}></lightning-input>
                    </template>
                    <template lwc:elseif={f.isTextarea}>
                        <lightning-textarea label={f.label} required={f.required}
                            value={f.value} data-name={f.api_name} data-type="textarea"
                            onchange={handleInput}></lightning-textarea>
                    </template>
                    <template lwc:elseif={f.isNumber}>
                        <lightning-input type="number" label={f.label} required={f.required}
                            value={f.value} data-name={f.api_name} data-type="number"
                            onchange={handleInput}></lightning-input>
                    </template>
                    <template lwc:elseif={f.isDate}>
                        <lightning-input type="date" label={f.label} required={f.required}
                            value={f.value} data-name={f.api_name} data-type="date"
                            onchange={handleInput}></lightning-input>
                    </template>
                    <template lwc:elseif={f.isCheckbox}>
                        <lightning-input type="checkbox" label={f.label}
                            checked={f.value} data-name={f.api_name} data-type="checkbox"
                            onchange={handleInput}></lightning-input>
                    </template>
                    <template lwc:elseif={f.isPicklist}>
                        <lightning-combobox label={f.label} required={f.required}
                            value={f.value} options={f.optionList}
                            data-name={f.api_name} data-type="picklist"
                            onchange={handleInput}></lightning-combobox>
                    </template>
                </div>
            </template>

            <template lwc:if={canUploadFiles}>
                <lightning-file-upload label="Attachments (imaging, prior reports)"
                    name="assessmentAttachments" record-id={uploadContext}
                    multiple onuploadfinished={handleUploadFinished}></lightning-file-upload>
            </template>

            <div class="slds-m-top_medium">
                <lightning-button variant="neutral" label="Save Draft" onclick={handleSaveDraft}></lightning-button>
                &nbsp;
                <lightning-button variant="brand" label="Submit for Review" onclick={handleSubmit}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
